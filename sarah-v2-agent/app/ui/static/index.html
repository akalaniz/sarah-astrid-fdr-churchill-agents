<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sarah v2.0</title>
    <link rel="stylesheet" href="/static/style.css?v=sarah-pdf-features-temporary-pdf-20260805a-response-modes-20260908">
  </head>
  <body>
    <main class="shell">
      <section class="chat-pane" aria-label="Sarah chat">
        <header class="topbar">
          <div>
            <h1>Sarah v2.0</h1>
            <p id="statusLine">Local voice interface</p>
          </div>
          <div class="topbar-actions">
            <label class="voice-picker">
              <span>Sarah voice</span>
              <select id="voiceSelect" title="Choose Sarah's speaker voice">
                <option>Loading voices...</option>
              </select>
            </label>
            <button id="speechToggleButton" class="secondary" type="button" aria-pressed="true">Speaker on</button>
            <button id="stopSpeechButton" class="secondary" type="button">Stop voice</button>
            <button id="exportConversationPdfButton" class="secondary" type="button">Export Conversation PDF</button>
            <button id="exportLastResponsePdfButton" class="secondary" type="button">Export Last Response PDF</button>
            <button id="resetButton" class="secondary" type="button">Reset</button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <div class="input-stack">
            <div class="response-controls">
              <fieldset id="responseModePicker" class="response-mode-picker">
                <legend>Response</legend>
                <div class="response-mode-options">
                  <input id="responseQuick" name="responseMode" type="radio" value="quick" checked>
                  <label for="responseQuick" title="Concise conversation with lower reasoning effort">Quick</label>
                  <input id="responseDeep" name="responseMode" type="radio" value="deep">
                  <label for="responseDeep" title="High reasoning effort and full-depth answers">Deep</label>
                </div>
              </fieldset>
              <fieldset id="audienceModePicker" class="response-mode-picker">
                <legend>Audience</legend>
                <div class="response-mode-options">
                  <input id="audienceFormal" name="audienceMode" type="radio" value="formal">
                  <label for="audienceFormal" title="Professional language; no profanity, flirting, pet names, or affection">Formal</label>
                  <input id="audienceInformal" name="audienceMode" type="radio" value="informal" checked>
                  <label for="audienceInformal" title="Existing conversational personality and tone">Informal</label>
                </div>
              </fieldset>
              <output id="responseModeStatus" class="response-mode-status" aria-live="polite"></output>
            </div>
            <textarea id="messageInput" rows="3" placeholder="Type to Sarah, or press Speak..." autocomplete="off"></textarea>
            <div class="temporary-pdf-controls">
              <button id="attachTemporaryPdfButton" class="small secondary" type="button">Attach PDF</button>
              <input id="temporaryPdfFileInput" type="file" accept="application/pdf,.pdf" hidden>
              <span id="temporaryPdfStatus" class="temporary-pdf-status" aria-live="polite"></span>
              <button id="detachTemporaryPdfButton" class="small secondary" type="button" hidden>Detach</button>
            </div>
            <div id="transcriptLine" class="transcript-line" aria-live="polite">Microphone idle.</div>
          </div>
          <div class="composer-actions">
            <button id="micButton" class="secondary mic-button" type="button" title="Speak through your PC microphone">Speak</button>
            <button id="sendButton" type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="side-pane" aria-label="Sources and memory">
        <section class="panel agent-panel" id="agentInboxSection">
          <div class="panel-title">
            <h2>Sources</h2>
            <div class="source-actions">
              <span id="sourceCount">0</span>
              <button id="addPdfButton" class="small secondary" type="button">Add PDF</button>
              <input id="pdfFileInput" type="file" accept="application/pdf,.pdf" hidden>
            </div>
          </div>
          <div id="pdfIngestStatus" class="pdf-ingest-status" role="status" aria-live="polite"></div>
          <div id="sourcesPanel" class="source-list">No sources yet.</div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>Memory</h2>
            <button id="refreshMemoryButton" class="small secondary" type="button">Refresh</button>
          </div>
          <div id="memoryPanel" class="memory-list">No memory loaded.</div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>Inter-agent inbox</h2>
            <button id="refreshAgentInboxButton" class="small secondary" type="button">Refresh</button>
            <button id="showAllAgentInboxButton" class="small secondary" type="button">All</button>
            <button id="archiveAgentInboxButton" class="small secondary" type="button">Archive</button>
            <button id="clearAgentInboxButton" class="small secondary" type="button">Clear</button>
          </div>
          <div class="agent-tools agent-send-section" id="agentSendSection">
            <textarea id="agentMessageInput" rows="3" placeholder="Send a note to Astrid..."></textarea>
            <button id="sendAgentMessageButton" class="small" type="button">Send to Astrid</button>
          </div>
          <div id="agentInboxPanel" class="agent-list agent-inbox-list">No agent messages loaded.</div>
        </section>
      </aside>
    </main>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"], ["$", "$"]],
          displayMath: [["\\[", "\\]"], ["$$", "$$"]],
          packages: {"[+]": ["ams", "noerrors", "noundefined"]},
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script defer src="/static/vendor/purify.min.js?v=sarah-equation-rendering-20260804i"></script>
    <script defer src="/static/vendor/marked.min.js?v=sarah-equation-rendering-20260804i"></script>
    <script defer src="/static/vendor/tex-chtml-full.js?v=sarah-equation-rendering-20260804l"></script>
    <script defer src="/static/chat-stream.js?v=streaming-20260908"></script>
    <script defer src="/static/speech-stream.js?v=sentence-speech-20260908"></script>
    <script defer src="/static/app.js?v=sarah-inter-agent-inbox-pdf-features-pdf-print-buttons-whitespace-temporary-pdf-20260805b-streaming-20260908-sentence-speech-20260908-response-modes-20260908-audience-20260909"></script>
  </body>
</html>
