<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarah Patch Priorities</title>
  <style>
    body { margin: 0; background: #eef1f6; color: #172033; font-family: Segoe UI, Arial, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .panel { background: #fbfcff; border: 1px solid #d8deea; border-radius: 8px; padding: 16px; box-shadow: 0 8px 24px rgba(23,32,51,0.08); }
    svg { width: 100%; height: auto; display: block; }
    .title { font-size: 24px; font-weight: 700; }
    .axis-label { font-size: 15px; font-weight: 650; fill: #30394d; }
    .tick, .caption, .edge-label { font-size: 12px; fill: #586174; }
    .point-label, .row-label { font-size: 12px; fill: #172033; font-weight: 600; }
    .node-label { font-size: 12px; fill: white; font-weight: 700; }
    .bar-value { font-size: 12px; fill: #30394d; font-weight: 650; }
    .resolved { fill-opacity: 0.28; stroke: #172033; stroke-width: 2; }
    .pending { fill-opacity: 0.55; stroke: #172033; stroke-width: 2; stroke-dasharray: 4,4; }
    .active { fill-opacity: 0.92; stroke: #172033; stroke-width: 1; }
    p, li { line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      
    <svg viewBox="0 0 1120 779" role="img" aria-label="Sarah patch priorities">
      <rect width="1120" height="779" fill="#fbfcff"/>
      <text x="560.0" y="32" text-anchor="middle" class="title">Patch Priority Chart</text>
      <text x="28" y="84" class="row-label">1. unify CLI and web route through app/core/sarah_engine.py</text><rect x="360" y="64" width="660.0" height="30" rx="6" fill="#f24e43"><title>unify CLI and web route through app/core/sarah_engine.py | risk reduction=226 | priority=135</title></rect><text x="1028.0" y="84" class="bar-value">risk -226 | P135</text><text x="28" y="124" class="row-label">2. force web endpoint to use same prompt_builder</text><rect x="360" y="104" width="613.3" height="30" rx="6" fill="#e5534c"><title>force web endpoint to use same prompt_builder | risk reduction=210 | priority=129</title></rect><text x="981.3" y="124" class="bar-value">risk -210 | P129</text><text x="28" y="164" class="row-label">3. add adult_intimacy regression tests</text><rect x="360" y="144" width="432.2" height="30" rx="6" fill="#b76973"><title>add adult_intimacy regression tests | risk reduction=148 | priority=119</title></rect><text x="800.2" y="164" class="bar-value">risk -148 | P119</text><text x="28" y="204" class="row-label">4. re-ingest source docs</text><rect x="360" y="184" width="420.5" height="30" rx="6" fill="#b46b75"><title>re-ingest source docs | risk reduction=144 | priority=110</title></rect><text x="788.5" y="204" class="bar-value">risk -144 | P110</text><text x="28" y="244" class="row-label">5. add RAG freshness check</text><rect x="360" y="224" width="370.9" height="30" rx="6" fill="#a77180"><title>add RAG freshness check | risk reduction=127 | priority=109</title></rect><text x="738.9" y="244" class="bar-value">risk -127 | P109</text><text x="28" y="284" class="row-label">6. add /debug_prompt_summary endpoint</text><rect x="360" y="264" width="338.8" height="30" rx="6" fill="#9f7487"><title>add /debug_prompt_summary endpoint | risk reduction=116 | priority=97</title></rect><text x="706.8" y="284" class="bar-value">risk -116 | P97</text><text x="28" y="324" class="row-label">7. reload config/sarah_master_prompt.md every session</text><rect x="360" y="304" width="303.7" height="30" rx="6" fill="#96798e"><title>reload config/sarah_master_prompt.md every session | risk reduction=104 | priority=99</title></rect><text x="671.7" y="324" class="bar-value">risk -104 | P99</text><text x="28" y="364" class="row-label">8. add no_multiple_choice_intimacy test</text><rect x="360" y="344" width="289.1" height="30" rx="6" fill="#927a91"><title>add no_multiple_choice_intimacy test | risk reduction=99 | priority=111</title></rect><text x="657.1" y="364" class="bar-value">risk -99 | P111</text><text x="28" y="404" class="row-label">9. validate config/sarah_constitution.yaml loading</text><rect x="360" y="384" width="286.2" height="30" rx="6" fill="#917b92"><title>validate config/sarah_constitution.yaml loading | risk reduction=98 | priority=96</title></rect><text x="654.2" y="404" class="bar-value">risk -98 | P96</text><text x="28" y="444" class="row-label">10. add policy-level military safety test</text><rect x="360" y="424" width="280.4" height="30" rx="6" fill="#907c93"><title>add policy-level military safety test | risk reduction=96 | priority=112</title></rect><text x="648.4" y="444" class="bar-value">risk -96 | P112</text><text x="28" y="484" class="row-label">11. separate user_profile and agent_profile memory</text><rect x="360" y="464" width="274.5" height="30" rx="6" fill="#8e7c94"><title>separate user_profile and agent_profile memory | risk reduction=94 | priority=98</title></rect><text x="642.5" y="484" class="bar-value">risk -94 | P98</text><text x="28" y="524" class="row-label">12. add route parity test</text><rect x="360" y="504" width="242.4" height="30" rx="6" fill="#86809b"><title>add route parity test | risk reduction=83 | priority=108</title></rect><text x="610.4" y="524" class="bar-value">risk -83 | P108</text><text x="28" y="564" class="row-label">13. add DIME_COA regression tests</text><rect x="360" y="544" width="233.6" height="30" rx="6" fill="#84819d"><title>add DIME_COA regression tests | risk reduction=80 | priority=97</title></rect><text x="601.6" y="564" class="bar-value">risk -80 | P97</text><text x="28" y="604" class="row-label">14. add source-doc coverage test</text><rect x="360" y="584" width="189.8" height="30" rx="6" fill="#7886a6"><title>add source-doc coverage test | risk reduction=65 | priority=94</title></rect><text x="557.8" y="604" class="bar-value">risk -65 | P94</text><text x="28" y="644" class="row-label">15. add /debug_model endpoint</text><rect x="360" y="624" width="184.0" height="30" rx="6" fill="#7787a7"><title>add /debug_model endpoint | risk reduction=63 | priority=87</title></rect><text x="552.0" y="644" class="bar-value">risk -63 | P87</text><text x="28" y="684" class="row-label">16. add current-events web retrieval test</text><rect x="360" y="664" width="58.4" height="30" rx="6" fill="#5796c2"><title>add current-events web retrieval test | risk reduction=20 | priority=77</title></rect><text x="426.4" y="684" class="bar-value">risk -20 | P77</text>
      <text x="690.0" y="761" text-anchor="middle" class="axis-label">Expected risk reduction</text>
    </svg>
    
    </section>
    <section>
      <p>Ranked by expected risk reduction. Priority also includes centrality, known findings, cascade observations, and difficulty.</p>
    </section>
  </main>
</body>
</html>
